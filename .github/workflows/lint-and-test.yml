name: Lint and test

on:
  pull_request:
  push:
    branches:
      - 'main'
      - 'releases/**'
  workflow_dispatch:

jobs:
  lint_and_test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Install Python 3.10–3.13
      run: uv python install 3.10 3.11 3.12 3.13

    - name: Lint
      run: uvx --from 'tox==4.21.*' --with 'tox-uv==1.16.*' tox -e lint

    - name: Test with pytest
      run: uvx --from 'tox==4.21.*' --with 'tox-uv==1.16.*' tox -f test

    - uses: actions/upload-artifact@v4
      with:
        name: Test Report
        path: ./reports/*
